[workspace]
resolver = "2"
members = [
    "ebpf_port_sentinel",
    "ebpf_port_sentinel-common",
    "ebpf_port_sentinel-ebpf",
]
default-members = ["ebpf_port_sentinel", "ebpf_port_sentinel-common"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
aya = { version = "0.16.0", default-features = false }
aya-build = { version = "0.2.1", default-features = false }
aya-ebpf = { version = "0.3.0", default-features = false }
aya-log = { version = "0.4.0", default-features = false }
aya-log-ebpf = { version = "0.3.0", default-features = false }

anyhow = { version = "1.0.105", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
# `std` feature is currently required to build `clap`.
#
# See https://github.com/clap-rs/clap/blob/61f5ee5/clap_builder/src/lib.rs#L15.
clap = { version = "4.6.10", default-features = false, features = ["std"] }
env_logger = { version = "0.11.12", default-features = false }
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.35", default-features = false }
tokio = { version = "1.54.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
which = { version = "8.0.6", default-features = false }

[profile.release.package.ebpf_port_sentinel-ebpf]
debug = 2
codegen-units = 1
strip = false
